<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    #color_area {
        height: 400px;
        background-color: rgb(87, 154, 159);
    }
</style>
</head>

<body>
    <div class="container">
        <div class="row mb-3">
            <div class="col" id="color_area"></div>
        </div>
        <div class="row justify-content-center">
            <div class="col d-grid">
                <button type="button" class="btn btn-danger" onclick="ubahwarna('red')">merah</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-primary" onclick="ubahwarna('blue')">biru</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-success" onclick="ubahwarna('green')">hijau</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-warning" onclick="ubahwarna('yellow')">kuning</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn" style="background-color: #ff69b4; color: white;" onclick="ubahwarna('#ff69b4')">
        pink
    </button>
</div>
        </div>
    </div>
    <div class="alert alert-light text-center mt-3" role="alert">
        Syifa Thalita Maharani | 25/560227/SV/26408 | PGWEB ACARA 3
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <script>
        //function mengubah warna menjadi merah
        function merah() {
            document.getElementById("color_area").style.
                backgroundColor = "red"
        }
        function biru() {
            document.getElementById("color_area").style.
                backgroundColor = "blue"
        }
        function hijau() {
            document.getElementById("color_area").style.
                backgroundColor = "green"
        }
        function kuning() {
            document.getElementById("color_area").style.
                backgroundColor = "yellow"
        }
        function ubahwarna(warna) {
            document.getElementById("color_area").style.
                backgroundColor = warna;
        }


    </script>
</body>

</html>
